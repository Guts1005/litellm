<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" role="img" aria-labelledby="t">
<title id="t">How the core builds each deployment with the host</title>
<style>/* litellm architecture diagrams v1, from the litellm-docs Aurora theme (src/css/custom.css). Embed verbatim in every SVG. */
svg { --ink:#272b37; --text:#3a3e4b; --muted:#646875; --line:#a3a8ba; --rule:#e3e5ee; --card:#ffffff; --canvas:#f7f8fd; --accent:#0117be; --accent-bg:#f2f4fd; --accent-line:#b9c1f0; --host:#1f6fa8; --host-bg:#eaf5fd; --store:#6b3fb8; --store-bg:#efe8fb; --warn:#b42318; --warn-bg:#fdecea; --ok:#1a7f4b; --ok-bg:#e7f6ee; }
@media (prefers-color-scheme: dark) {
  svg { --ink:#ffffff; --text:#d6d4ea; --muted:#a6a4c6; --line:#5c6294; --rule:#1a1f45; --card:#0f1335; --canvas:#080b26; --accent:#9fabff; --accent-bg:#161b4a; --accent-line:#3d4790; --host:#7cc4f5; --host-bg:#0f2a44; --store:#c3a6f0; --store-bg:#23173f; --warn:#f19a9a; --warn-bg:#3a1622; --ok:#7ee2a8; --ok-bg:#0f2e25; }
}
text { font-family: Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: var(--text); }
.mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.title { font-weight: 600; fill: var(--ink); }
.small { font-size: 11.5px; }
.muted { fill: var(--muted); }
.accent { fill: var(--accent); }
.center { text-anchor: middle; }
.end { text-anchor: end; }
.canvas { fill: var(--canvas); stroke: var(--rule); stroke-width: 1; }
.box { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
.box.core { fill: var(--accent-bg); stroke: var(--accent); }
.box.host { fill: var(--host-bg); stroke: var(--host); }
.box.store { fill: var(--store-bg); stroke: var(--store); }
.box.warn { fill: var(--warn-bg); stroke: var(--warn); }
.box.ok { fill: var(--ok-bg); stroke: var(--ok); }
.box.decision { fill: var(--card); stroke: var(--ink); }
.group { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
.group.core { stroke: var(--accent-line); }
.group-label { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: 0.06em; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.edge.strong { stroke: var(--ink); }
.edge.dashed { stroke-dasharray: 5 4; }
.edge.core { stroke: var(--accent); }
.edge.warn { stroke: var(--warn); }
.edge-label { font-size: 11.5px; fill: var(--muted); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.arrowhead { fill: var(--line); }
.arrowhead.strong { fill: var(--ink); }
.arrowhead.core { fill: var(--accent); }
.arrowhead.warn { fill: var(--warn); }
.lifeline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.note { fill: var(--accent-bg); stroke: var(--accent-line); stroke-width: 1; }
.step { fill: var(--accent); }
.step-text { font-size: 10.5px; font-weight: 600; fill: var(--card); text-anchor: middle; }</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead core" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="canvas" x="0.5" y="0.5" width="639" height="401" rx="8"/>
<line class="lifeline" x1="120" y1="56" x2="120" y2="388"/>
<line class="lifeline" x1="520" y1="56" x2="520" y2="388"/>
<rect class="box core" x="50" y="16" width="140" height="40" rx="6"/>
<text class="title center" x="120" y="40">Core</text>
<rect class="box host" x="450" y="16" width="140" height="40" rx="6"/>
<text class="title center" x="520" y="40">Host</text>
<rect class="group" x="24" y="68" width="592" height="310" rx="6"/>
<text class="group-label" x="36" y="84">LOOP</text>
<text class="small muted" x="76" y="84">each <tspan class="mono">model_list</tspan> entry</text>
<path class="edge" d="M120,112 H518" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="106">secrets (<tspan class="mono">os.environ/</tspan> references)</text>
<circle class="step" cx="146" cy="112" r="8"/><text class="step-text" x="146" y="115.5">1</text>
<path class="edge dashed" d="M520,140 H122" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="134">values</text>
<circle class="step" cx="494" cy="140" r="8"/><text class="step-text" x="494" y="143.5">2</text>
<path class="edge" d="M120,168 H518" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="162">validate</text>
<circle class="step" cx="146" cy="168" r="8"/><text class="step-text" x="146" y="171.5">3</text>
<path class="edge dashed" d="M520,196 H122" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="190">the normalized entry</text>
<circle class="step" cx="494" cy="196" r="8"/><text class="step-text" x="494" y="199.5">4</text>
<path class="edge" d="M120,224 H518" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="218">provider</text>
<circle class="step" cx="146" cy="224" r="8"/><text class="step-text" x="146" y="227.5">5</text>
<path class="edge dashed" d="M520,252 H122" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="246">e.g. azure</text>
<circle class="step" cx="494" cy="252" r="8"/><text class="step-text" x="494" y="255.5">6</text>
<path class="edge" d="M120,280 H518" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="274">added</text>
<circle class="step" cx="146" cy="280" r="8"/><text class="step-text" x="146" y="283.5">7</text>
<path class="edge dashed" d="M520,308 H122" marker-end="url(#arrow)"/>
<text class="edge-label center" x="320" y="302">the entry as the registry keeps it</text>
<circle class="step" cx="494" cy="308" r="8"/><text class="step-text" x="494" y="311.5">8</text>
<path class="edge" d="M120,336 H200 V360 H122" marker-end="url(#arrow)"/>
<circle class="step" cx="146" cy="336" r="8"/><text class="step-text" x="146" y="339.5">9</text>
<text class="edge-label" x="212" y="352">id, then join the registry</text>
</svg>
